# Local development extras. Docker Compose loads this file automatically
# alongside compose.yaml. For a production-like run without it:
#   docker compose -f compose.yaml up
services:
  db:
    ports:
      # Localhost only, so the database is not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  api:
    ports:
      # Localhost only. Until the ui service exists this is how to reach the API;
      # afterwards the browser goes through ui and this is just for debugging.
      - "127.0.0.1:${API_PORT:-8000}:3000"

  # Browsable API docs (official image), built from PostgREST's OpenAPI output.
  # Dev only: http://localhost:8081
  api-docs:
    image: swaggerapi/swagger-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: ${API_PUBLIC_URL:-http://localhost:8000}/
    ports:
      - "127.0.0.1:${API_DOCS_PORT:-8081}:8080"
