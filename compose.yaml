# Accommodation allocation PoC. Services are added step by step (see docs/build_plan.md).
name: accomm

services:
  db:
    build: ./db
    image: accomm-db:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accomm}
      POSTGRES_USER: ${POSTGRES_USER:-accomm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations (dbmate), then sets role passwords from .env, then exits.
  migrate:
    build: ./db
    image: accomm-db:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-accomm_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-accomm}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "-c"]
    command:
      - dbmate --wait up && psql "$$DATABASE_URL" -q -v api_password="$$API_DB_PASSWORD" -f /db/setup/roles.sql && echo "Roles updated."

volumes:
  pgdata:
