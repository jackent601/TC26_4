# Accommodation allocation PoC. Services are added step by step (see docs/build_plan.md).
name: accomm

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accomm}
      POSTGRES_USER: ${POSTGRES_USER:-accomm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations in db/migrations, then exits. Official dbmate image, unchanged.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-accomm_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-accomm}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: ["--wait", "up"]

  # Sets role passwords from .env (db/setup/roles.sql), then exits.
  # Official postgres image, used only for psql. Runs after every migrate.
  db-roles:
    image: postgres:16
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-accomm}
      PGUSER: ${POSTGRES_USER:-accomm_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    volumes:
      - ./db/setup:/db/setup:ro
    entrypoint: ["sh", "-c"]
    command:
      - psql -q -v api_password="$$API_DB_PASSWORD" -f /db/setup/roles.sql && echo "Roles updated."

  # API: the official PostgREST image, configured only (decision D27). It serves
  # the database's api schema as HTTP: GET /<view>, POST /rpc/<function>.
  # Connects as api_user and switches to api_access per request; the
  # api_internal.pre_request hook applies the X-Tenant and X-User headers.
  # No application code: every endpoint is a SQL view or function.
  api:
    image: postgrest/postgrest:v14.18
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://api_user:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB:-accomm}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: api_access
      PGRST_DB_PRE_REQUEST: api_internal.pre_request
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_HOST: localhost       # health endpoint, inside the container only
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_PUBLIC_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # UI (decisions D21, I6): React app built to static files and served by Caddy,
  # which forwards /api/* to the api service. The one service meant to be
  # reached from outside. Image built from ui/Dockerfile (official node + caddy).
  ui:
    build: ./ui
    image: accomm-ui:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8080}:8080"

  # Database tests (test only; decision I2). Starts a throwaway database inside
  # the container, applies all migrations, runs db/tests with pg_prove, checks
  # the migrations roll back and re-apply, then exits 0 (pass) or 1 (fail).
  # Never touches the db service or its data. Runs only when asked:
  #   docker compose --profile test run --rm db-test   (or scripts/db-test.sh)
  db-test:
    build: ./db/test
    image: accomm-db-test:local
    profiles: ["test"]
    volumes:
      - ./db/migrations:/db/migrations:ro
      - ./db/setup:/db/setup:ro
      - ./db/tests:/db/tests:ro

volumes:
  pgdata:
